services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: marketplace_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  auth-service:
    build: ./auth-service
    restart: on-failure
    environment:
      PORT: 3001
      DATABASE_URL: postgres://marketplace:devpassword@postgres:5432/marketplace_dev
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    restart: on-failure
    environment:
      PORT: 3002
      DATABASE_URL: postgres://marketplace:devpassword@postgres:5432/marketplace_dev
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build: ./order-service
    restart: on-failure
    environment:
      PORT: 3003
      DATABASE_URL: postgres://marketplace:devpassword@postgres:5432/marketplace_dev
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started

  search-service:
    build: ./search-service
    restart: on-failure
    environment:
      PORT: 3004
      RABBITMQ_URL: amqp://rabbitmq:5672
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      SEARCH_SERVICE_URL: http://search-service:3004
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - search-service

volumes:
  pgdata: